[project]
name = "uerj-intro-ai"
version = "1.0.0"
description = "Classic AI from first principles (UERJ coursework): graph search, CSP backtracking and a NumPy MLP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guilherme Fialho" }]
requires-python = ">=3.12"
keywords = ["search", "a-star", "csp", "backtracking", "neural-network", "numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.scripts]
intro-ai = "intro_ai.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intro_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "NPY", "PT"]
ignore = [
    "N803", # math-style argument names (X, W) mirror the formulas
    "N806", # math-style local names
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
